<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
        overflow:hidden;
    }

    .container{
        text-align:center;
        background:rgba(255,255,255,0.2);
        backdrop-filter:blur(10px);
        padding:30px;
        border-radius:20px;
        color:white;
        width:90%;
        max-width:400px;
        box-shadow:0 10px 30px rgba(0,0,0,0.2);
        animation:fadeIn 2s ease;
    }

    h1{
        font-size:2rem;
        margin-bottom:15px;
    }

    p{
        font-size:1.1rem;
        margin-bottom:20px;
        line-height:1.6;
    }

    .btn{
        padding:12px 25px;
        border:none;
        border-radius:30px;
        background:#fff;
        color:#ff4d6d;
        font-size:16px;
        cursor:pointer;
        font-weight:bold;
        transition:0.3s;
    }

    .btn:hover{
        transform:scale(1.1);
    }

    @keyframes fadeIn{
        from{
            opacity:0;
            transform:translateY(30px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    @media(max-width:480px){
        h1{
            font-size:1.7rem;
        }
        p{
            font-size:1rem;
        }
    }
</style>
</head>
<body>

<div class="container">
    <h1>🎂 Happy Birthday! 🎉</h1>
    <p>
        Wishing you a day filled with happiness, love, and lots of cake! 🥳<br>
        May all your dreams come true.
    </p>

    <button class="btn" onclick="celebrate()">
        🎁 Celebrate
    </button>
</div>

<!-- Confetti Library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
function celebrate() {
    var duration = 5 * 1000;
    var end = Date.now() + duration;

    (function frame() {
        confetti({
            particleCount: 5,
            angle: 60,
            spread: 70,
            origin: { x: 0 }
        });

        confetti({
            particleCount: 5,
            angle: 120,
            spread: 70,
            origin: { x: 1 }
        });

        if (Date.now() < end) {
            requestAnimationFrame(frame);
        }
    }());
}

// Auto confetti on page load
window.onload = function() {
    celebrate();
};
</script>

</body>
</html>
